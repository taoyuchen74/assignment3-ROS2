/hikrobot_camera:
  ros__parameters:

    # ROS 2 simulation time
    use_sim_time: false

    # ============================================================
    # Camera selection
    # ============================================================

    # camera_ip / serial_number / image_topic 仅在启动时生效，
    # 运行时修改会被节点拒绝，需重启后生效。

    # GigE camera IP address.
    # Leave empty when using a USB camera.
    camera_ip: ""

    # Camera serial number.
    # The current camera used for testing:
    # 00F78118392
    serial_number: "00F78118392"

    # ============================================================
    # ROS image topic
    # ============================================================

    image_topic: "/image_raw"

    # ============================================================
    # Camera parameters
    # ============================================================

    # Exposure time in microseconds.
    exposure_time: 10000.0

    # Camera gain.
    gain: 0.0

    # Acquisition frame rate.
    frame_rate: 30.0

    # Currently supported pixel format.
    pixel_format: "Mono8"
